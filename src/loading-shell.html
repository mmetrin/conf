<style>
  #bootstrap-loader {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: grid;
    place-items: center;
    background: #030307;
    color: #f5e9ff;
  }
  .bootstrap-loader__lens {
    position: relative;
    display: grid;
    place-items: center;
    width: 108px;
    height: 108px;
  }
  .bootstrap-loader__image {
    display: block;
    width: 67px;
    height: auto;
    object-fit: contain;
  }
  .bootstrap-loader__ring {
    position: absolute;
    inset: 0;
    border: 2px solid transparent;
    border-top-color: #f5e9ff;
    border-right-color: #b48aee;
    border-radius: 50%;
    box-shadow: 0 -3px 9px -3px #ddbdff;
    animation: bootstrap-spin 1.7s linear infinite;
  }
  .bootstrap-loader__ring--inner {
    inset: 17px;
    border-top-color: #fff6ff;
    border-right-color: #dbb5f766;
    animation-direction: reverse;
    animation-duration: 1.1s;
  }
  #bootstrap-error {
    position: absolute;
    top: calc(50% + 80px);
    left: 16px;
    right: 16px;
    text-align: center;
    font:
      16px/1.5 system-ui,
      sans-serif;
  }
  #bootstrap-error button {
    display: block;
    margin: 16px auto;
    padding: 10px 20px;
    color: inherit;
    background: #211d2c;
    border: 1px solid #b48aee;
    border-radius: 24px;
    font: inherit;
  }
  @keyframes bootstrap-spin {
    to {
      transform: rotate(360deg);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .bootstrap-loader__ring {
      animation: none;
    }
  }
  @media (max-width: 599px) {
    #bootstrap-loader {
      background: #00060f;
    }
  }
</style>
<div id="bootstrap-loader" role="status" aria-label="Загрузка">
  <div class="bootstrap-loader__lens" aria-hidden="true">
    <img class="bootstrap-loader__image" src="__LOADER_LENS_SRC__" width="134" height="127" alt="">
    <span class="bootstrap-loader__ring"></span>
    <span class="bootstrap-loader__ring bootstrap-loader__ring--inner"></span>
  </div>
  <div id="bootstrap-error" hidden></div>
</div>
